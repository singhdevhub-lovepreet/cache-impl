spring.datasource.url=jdbc:mysql://localhost:3306/cache_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=cacheuser
spring.datasource.password=cachepass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# LLM Configuration
llm.claude.api-key=${CLAUDE_API_KEY:not-set}
llm.claude.default-model=claude-sonnet-4-20250514
llm.openai.api-key=${OPENAI_API_KEY:not-set}
llm.openai.default-model=gpt-4o
llm.openai.embedding-model=text-embedding-3-small

# Embedding provider: ollama (free, local) | openai
embedding.provider=ollama
llm.ollama.base-url=http://localhost:11434
llm.ollama.embedding-model=all-minilm:33m

# Qdrant Vector DB
qdrant.url=https://b3354cb5-7bbb-4c60-9113-ac4576f1de31.us-west-1-0.aws.cloud.qdrant.io:6333
qdrant.api-key=${QDRANT_API_KEY}
qdrant.collection-name=booking_faqs

# RAG pipeline (hybrid search: dense + BM25 sparse)
rag.qdrant.collection-name=rag_documents
rag.chunk.size=500
rag.chunk.overlap=50
# BM25 tuning: k1 controls term-frequency saturation, b controls length normalization,
# avgdl is the assumed average chunk length in tokens (IDF is applied server-side by Qdrant).
rag.bm25.k1=1.2
rag.bm25.b=0.75
rag.bm25.avgdl=90
# How many candidates each retriever (dense/sparse) fetches before RRF fusion.
rag.search.prefetch-limit=20
